quarkus:
  quinoa:
    package-manager-install:
      node-version: 20.10.0
    ui-root-path: /
    dev-server:
      port: 3000
      direct-forwarding: true
    ignored-path-prefixes:
      - /api
      - /q
      - /public
    enable-spa-routing: true
  swagger-ui:
    always-include: true
    oauth-client-id: flox-frontend
    oauth-realm: quarkus
  oidc:
    auth-server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8090}/realms/${KEYCLOAK_REALM:quarkus}
    client-id: flox-backend
    credentials:
      secret: secret
    devservices:
      enabled: false
    roles:
      role-claim-path: realm_access/roles
  keycloak:
    admin-client:
      server-url: "http://localhost:8090/"
      realm: quarkus
      client-id: flox-backend
      client-secret: secret
      grant-type: client_credentials
    devservices:
      enabled: true
      realm-path: quarkus-realm.json
      port: 8090
      start-command: start-dev --features=organization
      container-env:
        KC_FEATURES: organization
  rest-client:
    logging:
      scope: request-response
      body-limit: 1000
  log:
#    level: DEBUG
    category:
      "org.jboss.resteasy.reactive.client.logging":
        level: DEBUG
  http:
    access-log:
      enabled: true
      pattern: "%r %s %b %D ms"
    auth:
      permission:
        assets:
          paths:
            - "/api/v1/whiteboards/*/assets/*"
          policy: permit
        api:
          paths:
            - "/api/v1/*"
          policy: authenticated
        swagger:
          paths:
            - "/q/swagger-ui/*"
            - "/q/openapi/*"
          policy: permit
        hello:
          paths:
            - "/board"
            - "/board/*"
          policy: permit
        ws:
          paths:
            - "/ws/*"
            - "/ws"
          policy: permit
        public-landing:
          paths:
            - "/"
          policy: permit
        public-static:
          paths:
            - "/*"
          policy: permit
  datasource:
    db-kind: postgresql
    devservices:
      enabled: true
  liquibase:
    migrate-at-start: true
  hibernate-orm:
    schema-management:
      strategy: validate
    mapping:
      format:
        global: ignore
  mailer:
    from: ${SMTP_FROM:floxBoard <no-reply@floxboard.io>}
    mock: true
  langchain4j:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      timeout: ${OLLAMA_TIMEOUT:180s}
      chat-model:
        model-id: ${OLLAMA_MODEL:llama3.2}
        temperature: ${AI_TEMPERATURE:0.65}
        top-p: ${AI_TOP_P:0.95}
      devservices:
        enabled: false

floxboard:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
  licensing:
    secret: ${LICENSING_SECRET:floxboard-default-licensing-secret-key-2026}
    public-key: ${LICENSING_PUBLIC_KEY:}
  ai:
    provider: ${AI_PROVIDER:langchain4j}
    temperature: ${AI_TEMPERATURE:0.65}
    top-p: ${AI_TOP_P:0.95}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}

"%test":
  quarkus:
    langchain4j:
      ollama:
        devservices:
          enabled: false
  floxboard:
    ai:
      provider: mock

"%prod":
  quarkus:
    mailer:
      mock: ${SMTP_MOCK:false}
      host: ${SMTP_HOST:smtp.sendgrid.net}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      start-tls: ${SMTP_STARTTLS:OPTIONAL}
      auth-methods: ${SMTP_AUTH_METHODS:PLAIN LOGIN}
      from: ${SMTP_FROM:floxBoard <no-reply@floxboard.io>}
      tls: ${SMTP_TLS:false}
    datasource:
      jdbc:
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:floxboard}
      username: ${POSTGRES_USER:floxboard}
      password: ${POSTGRES_PASSWORD:floxboard}
      devservices:
        enabled: false
    hibernate-orm:
      schema-management:
        strategy: validate
    keycloak:
      devservices:
        enabled: false
      admin-client:
        server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8090}
        realm: ${KEYCLOAK_REALM:quarkus}
        client-id: ${KEYCLOAK_CLIENT_ID:flox-backend}
        client-secret: ${KEYCLOAK_CLIENT_SECRET:secret}
    oidc:
      auth-server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8090}/realms/${KEYCLOAK_REALM:quarkus}
      client-id: ${KEYCLOAK_CLIENT_ID:flox-backend}
      credentials:
        secret: ${KEYCLOAK_CLIENT_SECRET:secret}
      roles:
        role-claim-path: realm_access/roles
