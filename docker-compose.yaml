services:
  postgres:
    image: postgres:17
    container_name: floxboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floxboard}
      POSTGRES_USER: ${POSTGRES_USER:-floxboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floxboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floxboard} -d ${POSTGRES_DB:-floxboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: floxboard-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - ./src/main/resources/quarkus-realm.json:/opt/keycloak/data/import/quarkus-realm.json:ro
      - ./floxboard-theme/dist_keycloak:/opt/keycloak/providers:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: floxboard-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

  ollama:
    image: ollama/ollama:latest
    container_name: floxboard-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  ollama-init:
    image: ollama/ollama:latest
    container_name: floxboard-ollama-init
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "until ollama list >/dev/null 2>&1; do echo 'Waiting for Ollama service...'; sleep 2; done;
       echo 'Pulling model ${OLLAMA_MODEL:-llama3.2}...';
       ollama pull ${OLLAMA_MODEL:-llama3.2};
       echo 'Ollama model ${OLLAMA_MODEL:-llama3.2} is ready!';"
    depends_on:
      - ollama

volumes:
  postgres_data:
  keycloak_data:
  ollama_data:
